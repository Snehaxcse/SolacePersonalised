[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Anthropic calls often exceed Netlify's 10s default.
[functions.claude]
  timeout = 26

[dev]
  command = "npm run dev"
  targetPort = 5173
  framework = "vite"

# SPA fallback for /quiz, /companion, and /sanctuary/*. force=false so static assets and
# /.netlify/functions/* are not rewritten to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; upgrade-insecure-requests"
